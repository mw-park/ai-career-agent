[project]
name = "ai-career-agent"
version = "0.1.0"
description = "AI-powered career opportunity discovery, evaluation, and tracking agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[project.scripts]
ai-career-agent = "ai_career_agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
